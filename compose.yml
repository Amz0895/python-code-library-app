---
services:
  database:
    container_name: db
    image: harshav323/python-pro:db
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_service
    image: harshav323/python-pro:auth
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  book_service:
    container_name: book_service
    image: harshav323/python-pro:book
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  borrow_service:
    container_name: borrow_service
    image: harshav323/python-pro:borrow
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  frontend:
    container_name: frontend
    image: harshav323/python-pro:app
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

networks:
  myapp:
    driver: overlay
volumes:
  mydata:
...
